# 음색 설정. `tts_config.yaml` 로 복사해서 고친다 (그쪽은 커밋되지 않는다).
#
# 경로는 전부 paths.models_dir 기준 상대 경로다.
# 넣는 법과 폴더 구조는 README 의 「모델 넣는 법」에 있다.
#
# **이 절을 통째로 지우면 models_dir 을 훑어 자동으로 감지한다.** 이름과 설명을
# 내가 정하고 싶을 때만 아래처럼 적는다 (하나라도 적으면 자동 감지는 쓰지 않는다).

# 목소리를 안 고르고 요청했을 때 쓸 것
default_voice: "example-jp"

# **GPT 가중치는 음색마다 두지 않는다.** 아래 paths.pretrained_gpt 하나를 전부
# 공유하고, 음색을 고를 때 바뀌는 것은 SoVITS 가중치뿐이다 (engine.py:54, 72).
voices:
  example-jp:
    # 학습한 SoVITS 가중치. 이 파일이 change_sovits_weights() 로 그대로 들어간다
    sovits_model: "example/jp/model-e8.ckpt"
    # 참조 음성 3-10초. 이 목소리를 흉내 낸다
    ref_audio: "example/jp/reference.wav"
    # 참조 음성에 실제로 담긴 말. **틀리면 품질이 눈에 띄게 나빠진다**
    ref_text: "参考音声で実際に話している内容をそのまま書く"
    language: "Japanese"
    # 확장 옵션 화면의 목록에 보일 설명
    description: "예시 음색 (일본어)"

  example-ko:
    sovits_model: "example/ko/model-e8.ckpt"
    ref_audio: "example/ko/reference.wav"
    ref_text: "참조 음성에서 실제로 말하는 내용을 그대로 적는다"
    language: "Korean"
    description: "예시 음색 (한국어)"

# 추론 설정 (고급). 그대로 두어도 된다
inference:
  top_k: 15
  top_p: 1.0
  temperature: 1.0
  speed: 1.0

paths:
  # 음색 가중치가 있는 폴더. GPT-SoVITS 체크아웃 기준 상대 경로
  models_dir: "../models"
  # 모든 음색이 공유하는 GPT 가중치. GPT-SoVITS 배포본에 들어 있다
  pretrained_gpt: "GPT_SoVITS/pretrained_models/s1v3.ckpt"
